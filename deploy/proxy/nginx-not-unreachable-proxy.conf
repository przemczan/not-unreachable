# /etc/nginx/snippets/not-unreachable-proxy.conf, included by nginx-not-unreachable.conf.
# X-Forwarded-For is set to $remote_addr, not appended to, so a client can't prepend a fake address.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
