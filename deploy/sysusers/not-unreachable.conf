# The service user (docs/design/deployment.md): a system user with its own group, no home, no shell
# and a locked password, so nobody can sign in as it. Installed as /usr/lib/sysusers.d/not-unreachable.conf.
# Its UID and GID are fixed, so a folder passed into an LXC container can be mapped before installing
# (docs/install.md, "The service user's ID"). 2000 is the default: install.sh writes the ID chosen at
# install, or an existing user's, in place of the 2000s below.
g not-unreachable 2000
u not-unreachable 2000:not-unreachable "NotUnreachable file sharing" / /usr/sbin/nologin
