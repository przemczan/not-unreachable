# NotUnreachable's root-owned folders (docs/design/deployment.md, "Config, secrets and data"),
# installed as /usr/lib/tmpfiles.d/not-unreachable.conf. /run is empty after every boot, so the mount
# helper's credentials folder is made again then; the others are checked and their modes kept.
d /run/not-unreachable-mount 0700 root root -
d /srv/not-unreachable 0755 root root -
d /srv/not-unreachable/mounts 0755 root root -
